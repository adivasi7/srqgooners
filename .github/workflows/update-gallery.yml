name: Auto Update Matchday Gallery

on:
  push:
    paths:
      - 'matchdayimages/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Gallery Script
        run: python update_gallery.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html gallery.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): auto-update matchday gallery" && git push)
