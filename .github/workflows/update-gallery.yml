name: Auto Update Matchday Gallery

on:
  push:
    branches:
      - main
    paths:
      - 'matchdayimages/**'
      - 'update_gallery.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Gallery Script
        run: python update_gallery.py

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gallery): auto-update matchday grid [skip ci]"
          file_pattern: "index.html gallery.html"
