<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchday Gallery | SRQ Gooners</title>
    <style>
        :root {
            --primary: #DB0007;
            --secondary: #063672;
            --gold: #9C824A;
            --dark: #111111;
            --light: #F8F9FA;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; }

        header {
            background-color: var(--dark);
            border-bottom: 4px solid var(--primary);
            padding: 0.75rem 2rem;
            position: sticky; top: 0; z-index: 100;
        }

        .nav-container {
            max-width: 1100px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo-wrapper { display: flex; align-items: center; gap: 0.85rem; text-decoration: none; }
        .logo-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
        .logo-text { color: var(--white); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }
        .logo-text span { color: var(--primary); }
        .nav-links a { color: var(--white); text-decoration: none; margin-left: 1.5rem; font-weight: 600; }
        .nav-links a:hover { color: var(--gold); }

        .container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 2.5rem; text-transform: uppercase; }
        .section-title::after { content: ''; display: block; width: 50px; height: 4px; background-color: var(--primary); margin: 0.5rem auto 0; }

        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .grid-item { background-color: #ddd; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; cursor: pointer; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .grid-item:hover img { transform: scale(1.05); }

        .btn-back { display: inline-block; background-color: var(--secondary); color: var(--white); padding: 0.6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 700; margin-bottom: 2rem; }

        .modal { display: none; position: fixed; z-index: 1000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 80vh; border-radius: 6px; }
        .close-modal { position: absolute; top: 20px; right: 35px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }

        footer { background-color: var(--dark); color: var(--white); text-align: center; padding: 2.5rem 1.5rem; margin-top: 4rem; border-top: 1px solid #222; }
        footer a { color: var(--gold); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-wrapper">
                <img src="otherimages/logo.jpg" alt="SRQ Gooners Logo" class="logo-img">
                <div class="logo-text">SRQ <span>Gooners</span></div>
            </a>
            <nav class="nav-links">
                <a href="index.html#location">Tiki Bar HQ</a>
                <a href="gallery.html" style="color: var(--gold);">Gallery</a>
                <a href="index.html#join">Facebook Group</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="btn-back">← Back to Home</a>
        <h1 class="section-title">All Matchday Photos</h1>
        
        <!-- GALLERY_START -->
<div id="photo-grid" class="photo-grid">
  <div class="grid-item"><img src="matchdayimages/778957985_1425901406257877_7636159168177965727_n.jpg" alt="SRQ Gooners Matchday"></div>
  <div class="grid-item"><img src="matchdayimages/774815609_1421502953364389_2941223258452980479_n.jpg" alt="SRQ Gooners Matchday"></div>
  <div class="grid-item"><img src="matchdayimages/710537345_1355888576592494_3343045660343955433_n.jpg" alt="SRQ Gooners Matchday"></div>
  <div class="grid-item"><img src="matchdayimages/706111992_1350825063765512_8225296266398926040_n.jpg" alt="SRQ Gooners Matchday"></div>
  <div class="grid-item"><img src="matchdayimages/705420194_1350835740431111_9174764699566675002_n.jpg" alt="SRQ Gooners Matchday"></div>
</div>
<!-- GALLERY_END -->
    </main>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="imgExpanded">
    </div>

    <footer>
        <p>&copy; SRQ Gooners. Sarasota's Unofficial Arsenal FC Supporters Group.</p>
        <p><a href="https://www.facebook.com/srqgooners" target="_blank">facebook.com/srqgooners</a></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("photo-grid").addEventListener("click", function(e) {
                if (e.target.tagName === 'IMG') {
                    document.getElementById("imageModal").style.display = "block";
                    document.getElementById("imgExpanded").src = e.target.src;
                }
            });
        });
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
    </script>
</body>
</html>
