<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchday Gallery | SRQ Gooners - Sarasota Arsenal Fans</title>
    
    <!-- Primary SEO & Social Meta Tags -->
    <meta name="description" content="Browse photos from SRQ Gooners matchday watch parties at Hot Sands Oasis Tiki Bar in Sarasota, FL.">
    <meta property="og:title" content="Matchday Gallery | SRQ Gooners">
    <meta property="og:description" content="See Sarasota Arsenal supporters celebrating live on matchdays at Hot Sands Oasis Tiki Bar.">
    <meta property="og:image" content="https://srqgooners.com/otherimages/logo.jpg">
    <meta property="og:url" content="https://srqgooners.com/gallery.html">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-wrapper">
                <img src="otherimages/logo.jpg" alt="SRQ Gooners Logo" class="logo-img">
                <div class="logo-text">SRQ <span>Gooners</span></div>
            </a>
            <nav class="nav-links">
                <a href="index.html#location">Tiki Bar HQ</a>
                <a href="gallery.html">Gallery</a>
                <a href="index.html#join">Follow Us</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div style="margin-bottom: 2rem;">
            <a href="index.html" class="btn-back">← Back to Home</a>
        </div>

        <section id="photos">
            <h2 class="section-title">All Matchday Photos</h2>
            <div id="photo-grid" class="photo-grid">
                <!-- Photos will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Modal for Fullscreen Photo Preview -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="imgExpanded" alt="Expanded matchday photo preview">
    </div>

    <footer>
        <p>&copy; SRQ Gooners. Sarasota's Unofficial Arsenal FC Supporters Group.</p>
        <p><a href="https://www.facebook.com/srqgooners" target="_blank">facebook.com/srqgooners</a></p>
    </footer>

    <script>
        // List of all photo filenames
        const photoList = [
            "778957985_1425901406257877_7636159168177965727_n.jpg",
            "774815609_1421502953364389_2941223258452980479_n.jpg",
            "710537345_1355888576592494_3343045660343955433_n.jpg",
            "705420194_1350835740431111_9174764699566675002_n.jpg",
            "706111992_1350825063765512_8225296266398926040_n.jpg",
            "1234.jpg",
            "123.jpg",
            "43erger.jpg",
            "5432.jpg"
        ];

        // Sort photos by filename in reverse order (newest first)
        photoList.sort().reverse();

        document.addEventListener("DOMContentLoaded", function() {
            const photoGrid = document.getElementById("photo-grid");
            
            // Create image elements and add to grid
            photoList.forEach(photo => {
                const gridItem = document.createElement("div");
                gridItem.className = "grid-item";
                
                const img = document.createElement("img");
                img.src = `matchdayimages/${photo}`;
                img.alt = "SRQ Gooners Matchday";
                img.loading = "lazy";
                
                gridItem.appendChild(img);
                photoGrid.appendChild(gridItem);
            });

            // Add click handler for modal
            photoGrid.addEventListener("click", function(e) {
                if (e.target.tagName === 'IMG') {
                    document.getElementById("imageModal").style.display = "block";
                    document.getElementById("imgExpanded").src = e.target.src;
                }
            });
        });

        function closeModal() { 
            document.getElementById("imageModal").style.display = "none"; 
        }
    </script>
</body>
</html>
