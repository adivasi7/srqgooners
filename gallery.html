<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsenal Matchday Gallery | SRQ Gooners Sarasota</title>
    
    <!-- Primary Keywords & Description -->
    <meta name="description" content="View all matchday photos from SRQ Gooners Arsenal watch parties at Hot Sands Oasis Tiki Bar & Grill in Sarasota, FL. Premier League, Champions League, and FA Cup photos.">
    <meta name="keywords" content="Arsenal photos Sarasota, Premier League watch party, Arsenal bar Sarasota, Gooners gallery, Arsenal supporters Sarasota">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="SRQ Gooners Arsenal Matchday Gallery | Sarasota">
    <meta property="og:description" content="View all matchday photos from SRQ Gooners watch parties at Hot Sands Oasis Tiki Bar & Grill in Sarasota, FL.">
    <meta property="og:image" content="https://srqgooners.com/otherimages/logo.jpg">
    <meta property="og:url" content="https://srqgooners.com/gallery.html">
    <meta name="twitter:card" content="summary_large_image">
    
    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "SRQ Gooners Matchday Photos",
      "description": "Arsenal FC supporters group photo gallery in Sarasota, Florida",
      "url": "https://srqgooners.com/gallery.html",
      "image": "https://srqgooners.com/otherimages/logo.jpg"
    }
    </script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-wrapper">
                <img src="otherimages/logo.jpg" alt="SRQ Gooners Logo" class="logo-img">
                <div class="logo-text">SRQ <span>Gooners</span></div>
            </a>
            <nav class="nav-links">
                <a href="index.html#location">Tiki Bar HQ</a>
                <a href="gallery.html" style="color: var(--gold);">Gallery</a>
                <a href="index.html#join">Facebook Group</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="btn-back">← Back to Home</a>
        <h1 class="section-title">All Matchday Photos</h1>
        
        <!-- GALLERY_START -->
<div id="photo-grid" class="photo-grid">
  <div class="grid-item"><img src="matchdayimages/778957985_1425901406257877_7636159168177965727_n.jpg" alt="Arsenal supporters watching Premier League match at Sarasota bar" loading="lazy"></div>
  <div class="grid-item"><img src="matchdayimages/774815609_1421502953364389_2941223258452980479_n.jpg" alt="SRQ Gooners community event at Premier League watch party" loading="lazy"></div>
  <div class="grid-item"><img src="matchdayimages/710537345_1355888576592494_3343045660343955433_n.jpg" alt="Sarasota Arsenal fans celebrating at Tiki Bar matchday" loading="lazy"></div>
  <div class="grid-item"><img src="matchdayimages/706111992_1350825063765512_8225296266398926040_n.jpg" alt="Arsenal supporters group photo at Hot Sands Oasis Sarasota" loading="lazy"></div>
  <div class="grid-item"><img src="matchdayimages/705420194_1350835740431111_9174764699566675002_n.jpg" alt="Gooners fans celebrating Arsenal victory in Sarasota" loading="lazy"></div>
</div>
<!-- GALLERY_END -->
    </main>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="imgExpanded">
    </div>

    <footer>
        <p>&copy; SRQ Gooners. Sarasota's Unofficial Arsenal FC Supporters Group.</p>
        <p><a href="https://www.facebook.com/srqgooners" target="_blank">facebook.com/srqgooners</a></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("photo-grid").addEventListener("click", function(e) {
                if (e.target.tagName === 'IMG') {
                    document.getElementById("imageModal").style.display = "block";
                    document.getElementById("imgExpanded").src = e.target.src;
                }
            });
        });
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
    </script>
</body>
</html>
